<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#172033">
  <title>Planning Atelier</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <div class="brand">
      <img class="brand-logo" src="/logo-planning-atelier.png.png" alt="Logo Planning Atelier">
      <div>
        <p class="eyebrow">ATELIER</p>
        <h1>Planning Atelier</h1>
        <p class="subtitle">Planning partagé — Olivier & Christophe</p>
      </div>
    </div>
    <button id="newSlot">＋ Nouveau rendez-vous</button>
  </header>
  <main>
    <div class="toolbar">
      <button id="prevMonth" aria-label="Mois précédent">‹</button>
      <h2 id="monthLabel">Chargement…</h2>
      <button id="nextMonth" aria-label="Mois suivant">›</button>
      <button id="today">Aujourd’hui</button>
    </div>
    <p id="status" role="status">Connexion au planning…</p>
    <section id="calendar" class="calendar" aria-label="Calendrier mensuel"></section>
    <section class="legend"><span class="dot"></span> Véhicule présent à l’atelier</section>
  </main>

  <dialog id="slotDialog">
    <form id="slotForm">
      <div class="dialog-head">
        <h2 id="formTitle">Nouveau rendez-vous</h2>
        <button type="button" class="icon-button" id="closeDialog" aria-label="Fermer">×</button>
      </div>
      <input type="hidden" id="slotId">
      <label>Date d’entrée <span class="required">(obligatoire)</span>
        <input id="entryDate" type="date" required>
      </label>
      <label>Date de restitution <span class="optional">(facultative)</span>
        <input id="returnDate" type="date">
      </label>
      <label>Véhicule / client / immatriculation <span class="optional">(facultatif)</span>
        <input id="vehicleInfo" type="text" placeholder="Texte libre">
      </label>
      <label>Notes <span class="optional">(facultatif)</span>
        <textarea id="notes" rows="3" placeholder="Informations complémentaires"></textarea>
      </label>
      <p class="hint">Les champs facultatifs peuvent rester vides. Les rappels et photos seront ajoutés dans les étapes suivantes.</p>
      <div class="actions">
        <button type="button" id="deleteSlot" class="danger hidden">Supprimer</button>
        <span class="grow"></span>
        <button type="button" id="cancel">Annuler</button>
        <button type="submit">Enregistrer</button>
      </div>
    </form>
  </dialog>
  <script src="/app.js" defer></script>
</body>
</html>
